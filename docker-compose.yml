# Inside the compose network, reach infra by service name, not localhost.
# (.env uses localhost for the host-based dev workflow.) Shared by the API and
# every Celery service — without it they dial localhost inside their own
# container and never reach Postgres or Redis.
x-compose-network-env: &compose-network-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DB_HOST:               db
  DB_USER:               susdevos
  DB_PASSWORD:           susdevos
  DB_NAME:               susdevos
  REDIS_URL:             redis://redis:6379/0
  CELERY_BROKER_URL:     redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CACHE_LOCATION:        redis://redis:6379/3
  AWS_S3_ENDPOINT_URL:   http://minio:9000

services:

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB:       susdevos
      POSTGRES_USER:     susdevos
      POSTGRES_PASSWORD: susdevos
    # No host port mapping — api/celery reach Postgres via the internal "db:5432"
    # hostname. Host 5432/5433 are already taken by other local databases.
    # To inspect from the host, add e.g.  ports: ["55432:5432"]
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susdevos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (local S3-compatible storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Django (API) ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *compose-network-env

  # ── Celery worker (default queue) ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A config.celery worker
      -Q default
      -c 4
      --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *compose-network-env

  # ── Celery worker (integrations queue) ───────────────────────────────────
  celery_integrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A config.celery worker
      -Q integrations
      -c 2
      --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *compose-network-env

  # ── Celery worker (reports queue) ─────────────────────────────────────────
  celery_reports:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A config.celery worker
      -Q reports
      -c 2
      --max-tasks-per-child=10
      --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *compose-network-env

  # ── Celery beat (scheduler) ───────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A config.celery beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *compose-network-env

volumes:
  postgres_data:
  redis_data:
  minio_data:
