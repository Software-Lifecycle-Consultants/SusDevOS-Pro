# TEMPORARY — HTTP-only config used ONLY during first-time cert issuance.
#
# This file deliberately lives OUTSIDE nginx/conf.d/. That directory is bind-mounted
# into the container and nginx loads every *.conf in it, so a stray HTTP-only config
# left there would define a second port-80 server for susdevos.com. nginx keeps the
# first match alphabetically and warns "conflicting server name ... ignored" for the
# rest — which would silently shadow the real HTTP→HTTPS redirect in susdevos.conf
# and serve the placeholder below to every plain-HTTP visitor instead.
#
# Usage — see docs/deployment.md §3:
#   1. mv nginx/conf.d/susdevos.conf nginx/conf.d/susdevos.conf.bak
#   2. cp nginx/init/susdevos-init.conf nginx/conf.d/susdevos.conf
#   3. docker compose -f docker-compose.prod.yml up -d nginx
#   4. issue the cert with certbot
#   5. mv nginx/conf.d/susdevos.conf.bak nginx/conf.d/susdevos.conf
#   6. docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# Step 5 must restore the real config — do not leave this one in conf.d/.
# ".bak" is safe to leave in place: it does not match *.conf, so nginx ignores it.

server {
    listen      80;
    server_name susdevos.com www.susdevos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "SusDevOS - cert issuance in progress\n";
    }
}
