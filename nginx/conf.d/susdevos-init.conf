# TEMPORARY — HTTP-only config used ONLY during first-time cert issuance.
#
# Steps:
#   1. mv nginx/conf.d/susdevos.conf nginx/conf.d/susdevos.conf.bak
#   2. cp nginx/conf.d/susdevos-init.conf nginx/conf.d/susdevos.conf
#   3. docker compose -f docker-compose.prod.yml up -d nginx
#   4. docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#        --webroot --webroot-path /var/www/certbot \
#        --email hello@susdevos.com --agree-tos --no-eff-email \
#        -d susdevos.com -d www.susdevos.com
#   5. mv nginx/conf.d/susdevos.conf.bak nginx/conf.d/susdevos.conf
#   6. docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# After certs are issued this file is no longer needed unless certs are lost.

server {
    listen      80;
    server_name susdevos.com www.susdevos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "SusDevOS — cert issuance in progress\n";
        add_header Content-Type text/plain;
    }
}
