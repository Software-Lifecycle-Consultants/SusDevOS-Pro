# TEMPORARY — HTTP-only config used ONLY during first-time cert issuance.
#
# Steps:
#   1. Rename this file to susdevos.conf (replacing the HTTPS config)
#   2. docker compose -f docker-compose.prod.yml up -d nginx
#   3. Run certbot to issue cert (see docs/deployment.md §3)
#   4. Rename back to susdevos-init.conf
#   5. Rename susdevos.conf.https → susdevos.conf
#   6. docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# After certs are issued, this file is never needed again unless certs are lost.

server {
    listen 80;
    server_name api.yourdomain.com;    # <-- replace with your domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "SusDevOS — cert issuance in progress\n";
        add_header Content-Type text/plain;
    }
}
