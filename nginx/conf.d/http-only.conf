# ── TEMPORARY: used ONLY for initial Let's Encrypt cert issuance ──────────────
#
# Steps:
#   1. Place this file and remove (or rename) susdevos.conf
#   2. docker compose -f docker-compose.prod.yml up -d nginx certbot
#   3. docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#        --webroot --webroot-path /var/www/certbot \
#        --email hello@susdevos.com --agree-tos --no-eff-email \
#        -d susdevos.com -d www.susdevos.com
#   4. Replace this file with susdevos.conf and reload nginx
#
# After cert issuance this file is no longer needed.

server {
    listen 80;
    server_name susdevos.com www.susdevos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "OK - cert issuance in progress";
    }
}
