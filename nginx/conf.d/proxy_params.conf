# Shared proxy headers — included by every proxy_pass location

proxy_http_version      1.1;
proxy_set_header        Host              $host;
proxy_set_header        X-Real-IP         $remote_addr;
proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto $scheme;
proxy_set_header        Connection        "";

# NOTE: proxy_read_timeout is deliberately NOT set here.
#
# This file is `include`d inside each location block, so its directives land in the
# same context as the location's own. A location that also sets proxy_read_timeout
# (e.g. /api/public/ wants a tighter 30s) would then be a duplicate, and nginx
# rejects that outright:
#
#   [emerg] "proxy_read_timeout" directive is duplicate in .../susdevos.conf:118
#
# The 120s default lives at server level in susdevos.conf instead, where a location
# can legitimately override it.
proxy_connect_timeout   10s;
proxy_send_timeout      120s;

proxy_buffering         on;
proxy_buffer_size       8k;
proxy_buffers           8 8k;
