# SusDevOS — Nginx production config — susdevos.com
# Prerequisite: certs issued via susdevos-init.conf + certbot (see docs/deployment.md §3)
# DH params:    openssl dhparam -out nginx/ssl/dhparam.pem 2048  (run once on server)

# ── Rate limiting zones ─────────────────────────────────────────────────────
# auth:       5 req/min  — login / token refresh (brute-force protection)
# api_public: 10 req/s   — unauthenticated public API (blog, contact form)
# api:        30 req/s   — authenticated API (generous — JWT limits abuse further)
# web:        30 req/s   — Next.js pages and assets

limit_req_zone $binary_remote_addr zone=auth:10m       rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m        rate=30r/s;
limit_req_zone $binary_remote_addr zone=web:10m        rate=30r/s;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen      80;
    server_name susdevos.com www.susdevos.com;

    # Let's Encrypt ACME webroot (cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex redirect ──────────────────────────────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name www.susdevos.com;

    ssl_certificate     /etc/letsencrypt/live/susdevos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/susdevos.com/privkey.pem;

    return 301 https://susdevos.com$request_uri;
}

# ── Primary HTTPS server ─────────────────────────────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name susdevos.com;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate         /etc/letsencrypt/live/susdevos.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/susdevos.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/susdevos.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_dhparam               /etc/nginx/ssl/dhparam.pem;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Default upstream read timeout for every location in this server. Set here
    # rather than in proxy_params.conf so that a location which needs a different
    # value (e.g. /api/public/) can override it — an include-time duplicate in the
    # same context is a hard nginx error, not an override.
    proxy_read_timeout        120s;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Security headers ─────────────────────────────────────────────────────
    # Next.js also sets most of these via next.config.ts headers() — belt and braces.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;

    # ── General ──────────────────────────────────────────────────────────────
    client_max_body_size 50M;   # bulk CSV imports, report attachments
    keepalive_timeout    65;

    # Gzip (Next.js also gzips — this covers API responses and direct static files)
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/vnd.api+json image/svg+xml;

    # ── Django static files — served directly by Nginx ───────────────────────
    # Volume: static_files → /var/www/static (collectstatic output)
    location /static/ {
        alias   /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Auth endpoints — strict rate limit ───────────────────────────────────
    # Django's auth routes carry NO trailing slash (apps/users/urls/auth.py), so
    # the trailing "/" this pattern used to require never matched and every login
    # fell through to the generic /api/ zone at 30r/s. Keep "/?$" — matching the
    # real URLs is what makes the 5r/m brute-force limit apply at all.
    # `onboard` sets an account password from an emailed token — same threat model
    # as `reset-password`, so it belongs in the strict zone alongside its siblings.
    location ~ ^/api/auth/(login|refresh|signup|forgot-password|reset-password|onboard)/?$ {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── Public API (blog, contact, estimator — unauthenticated) ─────────────
    location /api/public/ {
        limit_req zone=api_public burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
        proxy_read_timeout 30s;
    }

    # ── All other API requests (authenticated) ───────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── OpenAPI schema + Swagger UI (dev tooling) ────────────────────────────
    location /api/schema/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    # Optionally restrict to a known IP:
    # allow x.x.x.x;
    # deny all;
    location /admin/ {
        limit_req zone=api burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── Health check (uptime monitors — no rate limit, no log) ───────────────
    location = /health/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
        access_log off;
    }

    # ── Next.js immutable static assets ─────────────────────────────────────
    # Content-hashed filenames — cache forever, no revalidation needed.
    location /_next/static/ {
        proxy_pass http://nextjs:3000;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Next.js image optimisation ───────────────────────────────────────────
    location /_next/image {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://nextjs:3000;
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    location / {
        limit_req zone=web burst=60 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass         http://nextjs:3000;
        # WebSocket header (harmless in production, needed for dev HMR if ever exposed)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
