# SusDevOS — Nginx production config
# Replace every occurrence of api.yourdomain.com with your actual API domain.
# Prerequisite: certs issued via susdevos-init.conf + certbot (see docs/deployment.md §3)

# ── Rate limiting zones ─────────────────────────────────────────────────────
# auth: tighter — login/refresh endpoints
# api:  general — all other API calls
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Allow ACME challenge through HTTP for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name api.yourdomain.com;

    # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
    ssl_certificate      /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.yourdomain.com/chain.pem;

    # ── TLS settings ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_dhparam               /etc/nginx/ssl/dhparam.pem;    # generated on server — see docs/deployment.md §2
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css text/plain
                    application/xml application/vnd.api+json;

    # ── Upload size (report attachments, bulk CSV imports) ───────────────────
    client_max_body_size 50M;

    # ── Django static files ──────────────────────────────────────────────────
    location /static/ {
        alias   /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Auth endpoints — strict rate limit ───────────────────────────────────
    location ~ ^/api/v1/auth/(login|refresh)/ {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── Django admin — moderate rate limit ───────────────────────────────────
    location /admin/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── OpenAPI schema + Swagger UI ──────────────────────────────────────────
    location /api/schema/ {
        limit_req zone=api burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── All other API requests ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
    }

    # ── Health check (used by uptime monitors — no rate limit) ───────────────
    location = /health/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api:8000;
        access_log off;
    }

    # ── Deny everything else ─────────────────────────────────────────────────
    location / {
        return 404;
    }
}
