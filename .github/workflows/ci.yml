name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB:       susdevos_test
          POSTGRES_USER:     susdevos
          POSTGRES_PASSWORD: susdevos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U susdevos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY:              ci-insecure-key-do-not-use-in-prod-00000000000000
      DB_NAME:                 susdevos_test
      DB_USER:                 susdevos
      DB_PASSWORD:             susdevos
      DB_HOST:                 localhost
      DB_PORT:                 5432
      REDIS_URL:               redis://localhost:6379/2
      CELERY_BROKER_URL:       redis://localhost:6379/0
      CELERY_RESULT_BACKEND:   redis://localhost:6379/1
      DEFAULT_GWP_DATASET_ID:  1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install GDAL + system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev \
            libcairo2 libpango-1.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      - name: Seed test data
        working-directory: backend
        run: |
          python manage.py seed_gwp
          python manage.py seed_modules
          python manage.py seed_plans

      - name: Run tests
        working-directory: backend
        run: python -m pytest --tb=short -q

      - name: Check for unapplied migrations
        working-directory: backend
        run: python manage.py migrate --check

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: susdevos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
