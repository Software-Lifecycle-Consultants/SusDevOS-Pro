name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB:       susdevos_test
          POSTGRES_USER:     susdevos
          POSTGRES_PASSWORD: susdevos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U susdevos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY:              ci-insecure-key-do-not-use-in-prod-00000000000000
      DB_NAME:                 susdevos_test
      DB_USER:                 susdevos
      DB_PASSWORD:             susdevos
      DB_HOST:                 localhost
      DB_PORT:                 5432
      REDIS_URL:               redis://localhost:6379/2
      CELERY_BROKER_URL:       redis://localhost:6379/0
      CELERY_RESULT_BACKEND:   redis://localhost:6379/1
      DEFAULT_GWP_DATASET_ID:  1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install GDAL + system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev \
            libcairo2 libpango-1.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      - name: Seed test data
        working-directory: backend
        run: |
          python manage.py seed_gwp
          python manage.py seed_modules
          python manage.py seed_plans

      - name: Run tests
        working-directory: backend
        run: python -m pytest --tb=short -q

      - name: Check for unapplied migrations
        working-directory: backend
        run: python manage.py migrate --check

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: susdevos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: susdevos-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://api:8000
            NEXT_PUBLIC_SITE_URL=https://susdevos.com
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to VPS ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only deploy when tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never run two deploys against the VPS at once; queue instead of cancel
    # so every merged commit eventually reaches production.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          # Timeout generous — image builds take time on a small VPS
          command_timeout: 20m
          script: |
            set -e
            cd /opt/susdevos

            echo "==> Pulling latest code"
            git pull --ff-only origin main

            echo "==> Rebuilding app images"
            docker compose -f docker-compose.prod.yml build \
              api celery_worker celery_integrations celery_reports celery_beat nextjs

            echo "==> Running migrations (new image, before switching traffic)"
            docker compose -f docker-compose.prod.yml run --rm api \
              python manage.py migrate --no-input

            echo "==> Collecting static files"
            docker compose -f docker-compose.prod.yml run --rm api \
              python manage.py collectstatic --no-input --clear

            echo "==> Restarting app services (DB and Redis untouched)"
            docker compose -f docker-compose.prod.yml up -d --no-deps \
              api celery_worker celery_integrations celery_reports celery_beat nextjs

            echo "==> Waiting for API to become healthy"
            timeout 90 sh -c \
              'until docker compose -f docker-compose.prod.yml exec -T api \
                python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/\")" \
                2>/dev/null; do sleep 3; done'

            echo "==> Reloading Nginx (re-resolve recreated container IPs)"
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Deploy complete"
