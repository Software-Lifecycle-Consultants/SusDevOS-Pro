roles:
  - key: super_admin
    name: SuperAdmin
    description: Full system access. Bypasses all privilege checks.
  - key: admin
    name: Admin
    description: Full access within their entity and related branches.
  - key: manager
    name: Manager
    description: CRUD on all domain data; cannot verify emissions or manage entity settings.
  - key: staff
    name: Staff
    description: CRUD on domain data; no user management or entity settings access.
